<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pptx-player</title>
<!--
  ScreenPlayer PPT 播放器壳（双模式）：
  1) 转换模式：Godot 注入 window.loadPptxBase64(b64)，worker 把 pptx 转成
     每页一段 HTML，全部收齐后包成堆叠的 .slide-page 容器（1280x720 视口
     等比缩放居中），完成后标题置为 pptx:{页数}。
  2) 缓存模式：本页经 request_html_content 序列化落盘后再加载，DOM 里
     已有全部 .slide-page 与图表 SVG，内联导航脚本直接可用——
     序列化产物即自包含可播放文件（CSS 已内联，不依赖外部样式）。
-->
<style>
.hidden {
	display: none;
}

pre {
	width: 100%;
	height: 360px;
	overflow: scroll;
}

section {
	width: 100%;
	/*max-width: 920px;*/
	height: 690px;
	position: relative;
	border: 1px solid #333;
	background-color: #EFEFEF;
	text-align: center;
	border-radius: 10px;
	box-shadow: 1px 1px 3px #AAA;
	overflow: hidden;
	/*transform: scale(0.85);*/
}

section div.block {
	position: absolute;
	top: 0px;
	left: 0px;
	width: 100%;
}

section div.content {
	display: flex;
	flex-direction: column;
	/*
	justify-content: center;
	align-items: flex-end;
	*/
}

section div.v-up {
	justify-content: flex-start;
}
section div.v-mid {
	justify-content: center;
}
section div.v-down {
	justify-content: flex-end;
}

section div.h-left {
	align-items: flex-start;
	text-align: left;
}
section div.h-mid {
	align-items: center;
	text-align: center;
}
section div.h-right {
	align-items: flex-end;
	text-align: right;
}

section div.up-left {
	justify-content: flex-start;
	align-items: flex-start;
	text-align: left;
}
section div.up-center {
	justify-content: flex-start;
	align-items: center;
}
section div.up-right {
	justify-content: flex-start;
	align-items: flex-end;
}
section div.center-left {
	justify-content: center;
	align-items: flex-start;
	text-align: left;
}
section div.center-center {
	justify-content: center;
	align-items: center;
}
section div.center-right {
	justify-content: center;
	align-items: flex-end;
}
section div.down-left {
	justify-content: flex-end;
	align-items: flex-start;
	text-align: left;
}
section div.down-center {
	justify-content: flex-end;
	align-items: center;
}
section div.down-right {
	justify-content: flex-end;
	align-items: flex-end;
}

section span.text-block {
	/* display: inline-block; */
}

li.slide {
	margin: 10px 0px;
	font-size: 18px;
}

div.footer {
	text-align: center;
}

section table {
	position: absolute;
}

section table, section th, section td {
	border: 1px solid black;
}

section svg.drawing {
	position: absolute;
	overflow: visible;
}

.fileUpload {
    position: relative;
    overflow: hidden;
}
.fileUpload input.upload {
    position: absolute;
    top: 0;
    right: 0;
    margin: 0;
    padding: 0;
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    filter: alpha(opacity=0);
}

#pptx-thumb {
	min-width: 240px;
	height: 180px;
}
</style>

<style>
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
#stage { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; background: #000; overflow: hidden; }
.slide-page { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: none; align-items: center; justify-content: center; }
.slide-page.active { display: flex; }
.slide-page > section { flex: none; transform-origin: center center; margin: 0; border: none; border-radius: 0; box-shadow: none; }
</style>
<script src="js/chart/d3.min.js"></script>
<script src="js/chart/nv.d3.min.js"></script>
<script>
"use strict";
/* ================= 页码导航（转换模式与缓存模式共用） =================
   缓存模式：request_html_content 序列化出的 HTML 重新加载时，
   DOM 里已有全部 .slide-page，本脚本直接挂好导航并恢复标题。 */
var pptxPages = [];
window.currentSlide = 0;
window.getSlideCount = function() { return pptxPages.length; };
window.gotoSlide = function(n) {
	if (pptxPages.length === 0) return;
	n = Math.max(0, Math.min(n | 0, pptxPages.length - 1));
	for (var i = 0; i < pptxPages.length; i++) {
		pptxPages[i].classList.toggle("active", i === n);
	}
	window.currentSlide = n;
};
function initNav() {
	pptxPages = Array.prototype.slice.call(document.querySelectorAll(".slide-page"));
	if (pptxPages.length > 0) {
		window.gotoSlide(window.currentSlide);
		document.title = "pptx:{" + pptxPages.length + "}";
	}
}
document.addEventListener("DOMContentLoaded", initNav);

/* ================= PPTX 转换（Godot 端注入 base64 触发） ================= */
var convSlides = [];
var convW = 0, convH = 0;
var convCSS = "";
var convWorker = null;
var convShim = false;

window.loadPptxBase64 = function(b64) {
	try {
		var bin = atob(b64);
		var bytes = new Uint8Array(bin.length);
		for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		startConversion(bytes.buffer);
	} catch (e) {
		console.error("loadPptxBase64 failed", e);
		document.title = "pptx:error";
	}
};

function startConversion(buf) {
	convSlides = []; convCSS = "";
	try {
		convWorker = new Worker("./js/worker.js");
		convShim = false;
		convWorker.addEventListener("message", function(e) { onWorkerMsg(e.data); }, false);
		convWorker.postMessage({ "type": "processPPTX", "data": buf });
	} catch (e) {
		// CEF file:// 下 Worker 被禁用：降级为主线程 shim（worker.inline.js）
		convWorker = null;
		convShim = true;
		loadShimScripts(0, buf);
	}
}

var SHIM_SCRIPTS = [
	"js/jszip.min.js", "js/highlight.min.js", "js/colz.class.min.js",
	"js/tXml.js", "js/functions.js", "js/worker.inline.js"
];
function loadShimScripts(idx, buf) {
	if (idx >= SHIM_SCRIPTS.length) {
		window.__pptx_shim_post({ "type": "processPPTX", "data": buf });
		return;
	}
	var s = document.createElement("script");
	s.src = SHIM_SCRIPTS[idx];
	s.onload = function() { loadShimScripts(idx + 1, buf); };
	s.onerror = function() { document.title = "pptx:error"; };
	document.head.appendChild(s);
}
window.__pptx_on_worker_message = function(m) { onWorkerMsg(m); };

function onWorkerMsg(msg) {
	switch (msg.type) {
		case "slide":
			convSlides.push(msg.data);
			break;
		case "slideSize":
			convW = msg.data.width;
			convH = msg.data.height;
			break;
		case "globalCSS":
			convCSS = msg.data;
			break;
		case "ExecutionTime":
			buildSlidesDom();
			// 图表队列在转换完成后统一取回，用 d3/nv 渲染成 SVG（落入 DOM 随缓存序列化）
			if (convShim) window.__pptx_shim_post({ "type": "getMsgQueue" });
			else convWorker.postMessage({ "type": "getMsgQueue" });
			break;
		case "processMsgQueue":
			renderCharts(msg.data);
			finalizeConversion();
			break;
		case "ERROR":
			console.error("pptx worker:", msg.data);
			document.title = "pptx:error";
			break;
		default:
			break;
	}
}

/* 每页包一层 .slide-page 堆叠容器，按 slideSize 等比缩放居中到 1280x720 视口 */
function buildSlidesDom() {
	var stage = document.getElementById("stage");
	var scale = (convW > 0 && convH > 0) ? Math.min(1280 / convW, 720 / convH) : 1;
	for (var i = 0; i < convSlides.length; i++) {
		var page = document.createElement("div");
		page.className = "slide-page";
		page.innerHTML = convSlides[i];
		var section = page.firstElementChild;
		if (section) section.style.transform = "scale(" + scale + ")";
		stage.appendChild(page);
	}
	if (convCSS) {
		var st = document.createElement("style");
		st.textContent = convCSS;
		document.head.appendChild(st);
	}
}

function finalizeConversion() {
	if (convWorker) { convWorker.terminate(); convWorker = null; }
	window.currentSlide = 0;
	initNav();  // 挂导航 + 标题置为 pptx:{页数}（Godot 端轮询此标题判完成）
}

/* ================= 图表渲染（移植自 pptx2html.js，d3/nv 画 SVG） ================= */
function renderCharts(queue) {
	for (var i = 0; i < queue.length; i++) {
		renderSingleChart(queue[i].data);
	}
}

function renderSingleChart(d) {
	var chartID = d.chartID;
	var chartType = d.chartType;
	var chartData = d.chartData;
	var data = [];
	var chart = null;
	switch (chartType) {
		case "lineChart":
			data = chartData;
			chart = nv.models.lineChart().useInteractiveGuideline(true);
			chart.xAxis.tickFormat(function(t) { return chartData[0].xlabels[t] || t; });
			break;
		case "barChart":
			data = chartData;
			chart = nv.models.multiBarChart();
			chart.xAxis.tickFormat(function(t) { return chartData[0].xlabels[t] || t; });
			break;
		case "pieChart":
		case "pie3DChart":
			data = chartData[0].values;
			chart = nv.models.pieChart();
			break;
		case "areaChart":
			data = chartData;
			chart = nv.models.stackedAreaChart().clipEdge(true).useInteractiveGuideline(true);
			chart.xAxis.tickFormat(function(t) { return chartData[0].xlabels[t] || t; });
			break;
		case "scatterChart":
			for (var i = 0; i < chartData.length; i++) {
				var arr = [];
				for (var j = 0; j < chartData[i].length; j++) {
					arr.push({ x: j, y: chartData[i][j] });
				}
				data.push({ key: "data" + (i + 1), values: arr });
			}
			chart = nv.models.scatterChart()
						.showDistX(true).showDistY(true)
						.color(d3.scale.category10().range());
			chart.xAxis.axisLabel("X").tickFormat(d3.format(".02f"));
			chart.yAxis.axisLabel("Y").tickFormat(d3.format(".02f"));
			break;
		default:
	}
	if (chart !== null) {
		d3.select("#" + chartID)
			.append("svg")
			.datum(data)
			.transition().duration(500)
			.call(chart);
	}
}
</script>
</head>
<body>
<div id="stage"></div>
</body>
</html>
